version: 2
updates:
  # Actions use major tags; this opens a PR when a new major is out.
  # Dev dependencies are types and the compiler. A harness bump that moves a type
  # out of reach fails `pnpm typecheck` (see checks/sdk.ts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch bumps; majors still open their own PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
  # What a pinned via installs on people's machines: a bump here is the reviewed update.
  - package-ecosystem: npm
    directory: /relay/codex-acp
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # The Codex version CI's harnesses job tests with: via runs the person's own, usually the latest.
  - package-ecosystem: npm
    directory: /ci/codex
    schedule:
      interval: weekly
  # The OpenCode version CI's harnesses job tests with, as an image tag (the job downloads its release).
  - package-ecosystem: docker
    directory: /ci/opencode
    schedule:
      interval: weekly
  # testy, ACP's reference agent, which CI's harnesses job runs the relay against: a git dependency on
  # rust-sdk's main, its commit in Cargo.lock.
  - package-ecosystem: cargo
    directory: /ci/testy
    schedule:
      interval: weekly
    allow:
      - dependency-name: "agent-client-protocol*"
    # Both come from rust-sdk's one commit: one PR moves it.
    groups:
      rust-sdk:
        patterns: ["agent-client-protocol*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
